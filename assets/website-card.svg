<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">Saleh Elsaity Personal Website</title>
  <desc id="desc">A dark premium card linking to Saleh Elsaity's personal portfolio website.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#020617"/>
      <stop offset="0.55" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="0.5" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#a855f7"/>
    </linearGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#64748b" stroke-opacity="0.11"/>
    </pattern>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="300" rx="26" fill="url(#bg)"/>
  <rect width="1200" height="300" rx="26" fill="url(#grid)"/>
  <circle cx="1070" cy="35" r="180" fill="#4f46e5" opacity="0.14"/>
  <circle cx="70" cy="300" r="160" fill="#0891b2" opacity="0.10"/>

  <g transform="translate(72 55)">
    <rect width="330" height="190" rx="18" fill="#020617" stroke="#334155" stroke-width="2"/>
    <rect width="330" height="34" rx="18" fill="#111827"/>
    <rect y="17" width="330" height="17" fill="#111827"/>
    <circle cx="22" cy="17" r="5" fill="#ef4444"/>
    <circle cx="40" cy="17" r="5" fill="#f59e0b"/>
    <circle cx="58" cy="17" r="5" fill="#22c55e"/>
    <rect x="82" y="10" width="210" height="14" rx="7" fill="#1e293b"/>
    <rect x="26" y="61" width="175" height="14" rx="7" fill="url(#accent)" opacity="0.95"/>
    <rect x="26" y="88" width="250" height="9" rx="4.5" fill="#475569"/>
    <rect x="26" y="106" width="205" height="9" rx="4.5" fill="#334155"/>
    <rect x="26" y="140" width="95" height="27" rx="7" fill="#0e7490"/>
    <rect x="132" y="140" width="95" height="27" rx="7" fill="#312e81"/>
    <g stroke="url(#accent)" stroke-width="2" fill="none" opacity="0.75">
      <path d="M250 72L280 92L305 65"/>
      <path d="M258 116L286 102L311 126"/>
    </g>
    <g fill="#67e8f9" filter="url(#glow)">
      <circle cx="250" cy="72" r="4"/><circle cx="280" cy="92" r="4"/><circle cx="305" cy="65" r="4"/>
      <circle cx="258" cy="116" r="4"/><circle cx="286" cy="102" r="4"/><circle cx="311" cy="126" r="4"/>
    </g>
  </g>

  <g font-family="Segoe UI, Inter, Arial, sans-serif">
    <text x="455" y="78" fill="#67e8f9" font-family="Consolas, Menlo, monospace" font-size="17" font-weight="700" letter-spacing="2.5">LIVE PORTFOLIO</text>
    <text x="452" y="132" fill="#f8fafc" font-size="42" font-weight="800">saleh-one.vercel.app</text>
    <text x="455" y="174" fill="#cbd5e1" font-size="21">Projects, capabilities, engineering direction and contact.</text>
    <rect x="455" y="205" width="220" height="45" rx="10" fill="url(#accent)"/>
    <text x="492" y="235" fill="#ffffff" font-size="18" font-weight="800">OPEN WEBSITE  →</text>
  </g>

  <rect x="1" y="1" width="1198" height="298" rx="25" fill="none" stroke="#334155" stroke-width="2"/>
</svg>
